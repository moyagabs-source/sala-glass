<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>Snake</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#050806;color:#d8ffd8;overflow:hidden;font-family:"Press Start 2P",ui-monospace,monospace}
#app{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
#hud{position:absolute;left:160px;right:160px;top:44px;display:flex;justify-content:space-between;font-size:30px}
#hud b{font-weight:400;color:#fff}
#board{position:absolute;left:160px;top:110px;width:1600px;height:900px;background:#0b140d;box-shadow:0 0 0 6px #7dff8a;image-rendering:pixelated}
#msg{position:absolute;left:160px;top:110px;width:1600px;height:900px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px;text-align:center}
#msg h1{margin:0;font:400 104px/1 "Press Start 2P",monospace;color:#7dff8a;text-shadow:7px 7px 0 #103d1c}
#msg p{margin:0;font-size:30px;line-height:1.7;color:#fff}
#msg small{font-size:20px;color:#a9d8ae}
#fade{position:fixed;inset:0;background:#000;pointer-events:none;opacity:0;animation:in .34s ease-out}
#fade.out{animation:none;transition:opacity .26s ease-in}
@keyframes in{from{opacity:1}to{opacity:0}}
</style>
</head>
<body>
<div id="app">
  <div id="hud"><span>PUNTOS <b id="score">0</b></span><span>RÉCORD <b id="best">0</b></span></div>
  <canvas id="board" width="800" height="450"></canvas>
  <div id="msg"><h1>SNAKE</h1><p>OK PARA EMPEZAR</p><small>FLECHAS PARA MOVERTE · ATRÁS PARA SALIR</small></div>
</div>
<div id="fade"></div>

<script>
/* Snake: no libraries or files. Only the cells that change are redrawn, so it asks almost nothing of the TV. */
const CELL=25,W=32,H=18,START_MS=150,MIN_MS=70;
const $=id=>document.getElementById(id),ctx=$('board').getContext('2d',{alpha:false});
const HOME='./'+(/github\.io$/.test(location.hostname)?'':'?tv=1&live=1&demo=1');
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const DIRS={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};
let snake,dir,turns,food,score=0,best=+store.get('sala-snake')||0,running=false,stepMs=START_MS,lastStep=0;

function fit(){$('app').style.transform='scale('+Math.min(innerWidth/1920,innerHeight/1080)+')'}
addEventListener('resize',fit);fit();
$('best').textContent=best;

/* The game area kept old emulator data on this TV: clear it once. */
try{
  ['sala-juegos','EmulatorJS-roms','EmulatorJS-core','/data/saves'].forEach(n=>indexedDB.deleteDatabase(n));
  localStorage.removeItem('sala-drive');
}catch(e){}

let actx=null;
function beep(notes){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const play=()=>{
      let t=actx.currentTime+.01;
      notes.forEach(n=>{
        const o=actx.createOscillator(),g=actx.createGain();
        o.type='square';o.frequency.value=n[0];
        g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.001,t+n[1]);
        o.connect(g).connect(actx.destination);o.start(t);o.stop(t+n[1]);
        t+=n[1];
      });
    };
    actx.state==='running'?play():actx.resume().then(play).catch(()=>{});
  }catch(e){}
}
const SFX={eat:[[660,.05],[880,.07]],over:[[392,.1],[294,.1],[196,.18]],start:[[523,.06],[784,.09]]};

const cell=(x,y,c)=>{ctx.fillStyle=c;ctx.fillRect(x*CELL+1,y*CELL+1,CELL-2,CELL-2)};
function placeFood(){
  do{food={x:Math.floor(Math.random()*W),y:Math.floor(Math.random()*H)}}
  while(snake.some(s=>s.x===food.x&&s.y===food.y));
  cell(food.x,food.y,'#ff5a4f');
}
function start(){
  ctx.fillStyle='#0b140d';ctx.fillRect(0,0,800,450);
  snake=[{x:12,y:9},{x:11,y:9},{x:10,y:9}];dir=[1,0];turns=[];score=0;stepMs=START_MS;
  $('score').textContent=0;$('msg').style.display='none';
  snake.forEach(s=>cell(s.x,s.y,'#7dff8a'));
  placeFood();beep(SFX.start);
  running=true;lastStep=0;requestAnimationFrame(loop);
}
function over(){
  running=false;beep(SFX.over);
  if(score>best){best=score;store.set('sala-snake',best);$('best').textContent=best}
  $('msg').style.display='flex';
  $('msg').querySelector('h1').textContent='GAME OVER';
  $('msg').querySelector('p').textContent=score+' PUNTOS · OK PARA REPETIR';
}
function step(){
  if(turns.length)dir=turns.shift();
  const head={x:snake[0].x+dir[0],y:snake[0].y+dir[1]},eat=head.x===food.x&&head.y===food.y;
  const body=eat?snake:snake.slice(0,-1);
  if(head.x<0||head.y<0||head.x>=W||head.y>=H||body.some(s=>s.x===head.x&&s.y===head.y))return over();
  cell(snake[0].x,snake[0].y,'#3fbd5a');
  snake.unshift(head);
  cell(head.x,head.y,'#7dff8a');
  if(eat){
    score+=10;$('score').textContent=score;
    stepMs=Math.max(MIN_MS,stepMs-3);
    beep(SFX.eat);placeFood();
  }else{
    const tail=snake.pop();
    ctx.fillStyle='#0b140d';ctx.fillRect(tail.x*CELL,tail.y*CELL,CELL,CELL);
  }
}
function loop(t){
  if(!running)return;
  requestAnimationFrame(loop);
  lastStep=lastStep||t;
  if(t-lastStep>=stepMs){lastStep=t;step()}
}
function turn(d){
  const prev=turns.length?turns[turns.length-1]:dir;
  if(turns.length<2&&d[0]!==-prev[0]&&d[1]!==-prev[1]&&(d[0]!==prev[0]||d[1]!==prev[1]))turns.push(d);
}
function leave(){
  const f=$('fade');f.classList.add('out');
  requestAnimationFrame(()=>requestAnimationFrame(()=>{f.style.opacity=1}));
  setTimeout(()=>location.replace(HOME),280);
}
addEventListener('keydown',e=>{
  if(e.key==='Escape'||e.keyCode===8||e.keyCode===461){e.preventDefault();return leave()}
  if(DIRS[e.key]){e.preventDefault();if(running)turn(DIRS[e.key]);return}
  if((e.key==='Enter'||e.key===' ')&&!running){e.preventDefault();start()}
});

/* Game controller: the same moves as the remote. */
const was={};
addEventListener('gamepadconnected',()=>setInterval(()=>{
  const p=[...navigator.getGamepads()].find(Boolean);if(!p)return;
  const b=i=>!!(p.buttons[i]&&p.buttons[i].pressed);
  const now={ok:b(0)||b(9),back:b(1),ArrowUp:b(12)||p.axes[1]<-.6,ArrowDown:b(13)||p.axes[1]>.6,ArrowLeft:b(14)||p.axes[0]<-.6,ArrowRight:b(15)||p.axes[0]>.6};
  Object.keys(now).forEach(k=>{
    if(now[k]&&!was[k]){
      if(k==='ok'){if(!running)start()}
      else if(k==='back')leave();
      else if(running)turn(DIRS[k]);
    }
    was[k]=now[k];
  });
},60));
</script>
</body>
</html>
