<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>Prueba de música</title>
<style>
body{margin:0;height:100vh;background:#0d0d0d;color:#f1f2f0;font:400 36px system-ui,sans-serif;padding:80px 140px;box-sizing:border-box}
h1{font-size:68px;font-weight:500;margin:0 0 30px}
#s{font-size:52px;font-weight:600;color:#3ddc97;margin-bottom:26px}
#log{font-size:27px;line-height:1.45;color:#b8bcba;white-space:pre-wrap}
</style>
</head>
<body>
<h1>Prueba de música</h1>
<div id="s">Iniciando…</div>
<div id="log"></div>
<script>
/* The token arrives in the address fragment, is kept on this TV only and is removed from the address right away. */
const KEY='sala-spotify',$=id=>document.getElementById(id);
const log=m=>{$('log').textContent+=m+'\n'};
const state=t=>{$('s').textContent=t};
if(location.hash.length>4){
  try{localStorage.setItem(KEY,decodeURIComponent(escape(atob(location.hash.slice(1)))))}catch(e){log('token: '+e.message)}
  history.replaceState(null,'',location.pathname);
}
let tok=null;try{tok=JSON.parse(localStorage.getItem(KEY))}catch(e){}
async function token(){
  if(!tok)throw new Error('sin permiso');
  if(tok.expires_at-Date.now()/1000>60)return tok.access_token;
  const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:new URLSearchParams({grant_type:'refresh_token',refresh_token:tok.refresh_token,client_id:tok.client_id})});
  if(!r.ok)throw new Error('token '+r.status);
  const n=await r.json();
  tok=Object.assign(tok,n,{expires_at:Math.floor(Date.now()/1000)+n.expires_in});
  localStorage.setItem(KEY,JSON.stringify(tok));
  return tok.access_token;
}
const api=async(path,method,body)=>fetch('https://api.spotify.com/v1'+path,{method:method||'GET',headers:{Authorization:'Bearer '+await token(),'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
window.onSpotifyWebPlaybackSDKReady=()=>{
  log('reproductor cargado');
  const p=new Spotify.Player({name:'Sala Glass',getOAuthToken:cb=>token().then(cb).catch(e=>log('token: '+e.message)),volume:1});
  ['initialization_error','authentication_error','account_error','playback_error'].forEach(n=>p.addListener(n,e=>{log(n+': '+e.message);state('ERROR: '+n)}));
  p.addListener('not_ready',()=>log('dispositivo no listo'));
  p.addListener('ready',async({device_id})=>{
    log('dispositivo listo');state('Conectado, pidiendo música…');
    try{
      p.activateElement&&p.activateElement();
      const l=await (await api('/me/playlists?limit=1')).json();
      const uri=l.items&&l.items[0]&&l.items[0].uri;
      log('playlist: '+(l.items&&l.items[0]?l.items[0].name:'ninguna'));
      const r=await api('/me/player/play?device_id='+device_id,'PUT',{context_uri:uri});
      log('orden de reproducir: '+r.status);
    }catch(e){log('play: '+e.message)}
  });
  let last=null;
  p.addListener('player_state_changed',s=>{
    if(!s)return;
    const n=s.track_window.current_track.name;
    if(n!==last){last=n;log('canción: '+n)}
    state(s.paused?'En pausa':'SONANDO: '+n);
  });
  p.connect().then(ok=>log('conectar: '+ok));
  window.player=p;
};
const sdk=document.createElement('script');sdk.src='https://sdk.scdn.co/spotify-player.js';sdk.onerror=()=>state('ERROR: no cargó el reproductor');document.head.append(sdk);
if(!tok)state('ERROR: falta el permiso');
</script>
</body>
</html>
