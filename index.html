<!doctype html>
<html lang="es"><head><meta name="viewport" content="width=1920"></head><body>
<meta charset="utf-8">
<title>Sala Glass</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script>if(/github\.io$/.test(location.hostname)||/[?&]tv/.test(location.search))document.documentElement.classList.add('lite')</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700&family=DM+Mono:wght@300&family=Doto:wght@700&family=Geist:wght@200;300;400;500;600&family=Instrument+Serif&display=swap">
<style>
/* Layout: lienzo fijo de TV 1920x1080. Bienvenida arriba, reloj a la izquierda, clima a la derecha y seis apps abajo.
   El ambiente sigue la hora del día. */
:root{
  color-scheme:dark;
  --ink:#f6f7fb;
  --ink-soft:rgba(246,247,251,.74);
  --glass:rgba(255,255,255,.11);
  --glass-strong:rgba(255,255,255,.2);
  --edge:rgba(255,255,255,.24);
  --ground:#0c0e16;
  --shadow:rgba(4,6,14,.38);
  --font:"Geist",-apple-system,"SF Pro Display","Segoe UI",system-ui,sans-serif;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
  display:flex;align-items:center;justify-content:center;box-sizing:border-box}
*{box-sizing:border-box}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;outline:none}

#fit{position:relative;flex:none}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:var(--ground);border-radius:6px}
.amb{position:absolute;inset:-12%;opacity:0;transition:opacity 1.6s ease}
.amb.on{opacity:1}
#drift{position:absolute;inset:0;animation:drift 38s ease-in-out infinite alternate}
@keyframes drift{from{transform:scale(1) translate3d(-1.5%,-1%,0)}to{transform:scale(1.08) translate3d(1.5%,1%,0)}}
#veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,8,16,.1),rgba(6,8,16,.34))}

.glass{background:var(--glass);border:1px solid var(--edge);
  -webkit-backdrop-filter:blur(34px) saturate(165%);backdrop-filter:blur(34px) saturate(165%);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.34),inset 0 -1px 0 rgba(255,255,255,.07),0 28px 64px var(--shadow)}

#ui{position:absolute;inset:0;padding:64px 96px 72px;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr auto;row-gap:24px}
#railBox{min-width:0}

#top{display:flex;justify-content:space-between;align-items:flex-start;gap:40px}
#hello{font-size:64px;font-weight:500;letter-spacing:-.025em;line-height:1.08}
#line{font-size:32px;font-weight:300;color:var(--ink-soft);margin-top:10px;max-width:1100px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pills{display:flex;gap:14px;flex:none}
.pill{height:62px;padding:0 28px;border-radius:31px;font-size:25px;font-weight:500;display:flex;align-items:center;white-space:nowrap;transition:transform .22s cubic-bezier(.2,.8,.2,1),background .22s}
.pill:focus,.pill:hover{background:rgba(255,255,255,.88);color:#10131d;transform:scale(1.06)}

#mid{display:grid;grid-template-columns:1fr 860px;align-items:center;column-gap:56px;min-height:0}
#time{font-size:196px;font-weight:200;line-height:1;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.s-editorial{font-family:"Instrument Serif",Georgia,serif;font-weight:400}
.s-puntos{font-family:"Doto",ui-monospace,monospace;font-weight:700}
.s-condensado{font-family:"Big Shoulders Display","Arial Narrow",sans-serif;font-weight:700}
.s-mono{font-family:"DM Mono",ui-monospace,monospace;font-weight:300}
#clock[data-s="editorial"] #time{font-size:250px;font-weight:400;letter-spacing:-.02em}
#clock[data-s="puntos"] #time{font-size:190px;font-weight:700;letter-spacing:-.02em}
#clock[data-s="condensado"] #time{font-size:250px;font-weight:700;letter-spacing:-.005em}
#clock[data-s="mono"] #time{font-size:166px;font-weight:300;letter-spacing:-.05em}
#analog{width:320px;height:320px}
#analog svg,.clockopt svg{display:block;width:100%;height:100%}
#date{font-size:36px;font-weight:300;margin-top:12px;color:var(--ink-soft)}
#date::first-letter{text-transform:uppercase}

#weather{border-radius:44px;padding:30px 40px;display:grid;grid-template-rows:auto auto;row-gap:24px}
#wNow{display:grid;grid-template-columns:150px 1fr auto;align-items:center;column-gap:28px}
#wIcon{width:150px;height:150px}
#wIcon svg,.wDay svg{display:block;width:100%;height:100%}
#wTemp{font-size:112px;font-weight:300;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
#wText{font-size:32px;font-weight:500;line-height:1.15}
#wCity{font-size:25px;color:var(--ink-soft);margin-top:6px}
#wMeta{text-align:right;font-size:25px;line-height:1.5;color:var(--ink-soft);white-space:nowrap}
#wDays{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;border-top:1px solid var(--edge);padding-top:20px}
.wDay{display:grid;grid-template-columns:56px 1fr;column-gap:14px;align-items:center}
.wDay svg{width:56px;height:56px}
.wDay b{display:block;font-size:24px;font-weight:500}
.wDay span{font-size:24px;color:var(--ink-soft);font-variant-numeric:tabular-nums}

.blob{position:absolute;width:420px;height:420px;border-radius:50%;left:0;top:0;will-change:transform}
#b0{background:radial-gradient(closest-side,var(--b0),transparent);animation:b0 46s ease-in-out infinite alternate}
#b1{background:radial-gradient(closest-side,var(--b1),transparent);animation:b1 58s ease-in-out infinite alternate}
@keyframes b0{from{transform:translate3d(80px,60px,0) scale(3)}to{transform:translate3d(760px,300px,0) scale(3.6)}}
@keyframes b1{from{transform:translate3d(1400px,520px,0) scale(3.4)}to{transform:translate3d(620px,120px,0) scale(2.8)}}
.calm .blob{animation:none}
.calm #b0{transform:translate3d(120px,80px,0) scale(3.2)}
.calm #b1{transform:translate3d(1300px,480px,0) scale(3.2)}

#railCap{font-size:27px;font-weight:500;color:var(--ink-soft);margin-bottom:34px}
#railWrap{overflow:hidden;margin:-12px -12px;padding:12px}
#rail{display:flex;gap:20px;will-change:transform;transition:transform .2s ease-out}
#saverBtn{width:62px;padding:0;justify-content:center}
#saverBtn svg{width:28px;height:28px;fill:currentColor;display:block}
.nothing #pills #saverBtn{width:50px;padding:0}
.nothing #pills #saverBtn svg{width:24px;height:24px}
/* Screensaver */
#saver{position:absolute;inset:0;z-index:8;display:none;color:#fff;overflow:hidden}
.idle #saver{display:block}
.idle #ui{visibility:hidden}
#sPhoto,#sShade{position:absolute;display:none}
/* Spotify's photos stop at 640px: shown at the height of the screen beside the music, never stretched across it */
#sPhoto{right:0;top:0;width:1080px;height:1080px;overflow:hidden;transform-origin:100% 50%;will-change:transform;animation:sKen 36s ease-in-out infinite alternate}
#sBg{width:100%;height:100%;object-fit:cover;display:block}
#sPhoto::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#000 0,rgba(0,0,0,.9) 14%,rgba(0,0,0,.62) 32%,rgba(0,0,0,.26) 52%,transparent 74%),linear-gradient(0deg,#000 0,rgba(0,0,0,.72) 16%,transparent 44%),linear-gradient(180deg,#000 0,rgba(0,0,0,.5) 12%,transparent 30%)}
@keyframes sKen{from{transform:scale(1)}to{transform:scale(1.05)}}
#sShade{inset:0;background:linear-gradient(90deg,#000 40%,rgba(0,0,0,.5) 56%,transparent 72%),linear-gradient(0deg,rgba(0,0,0,.72),rgba(0,0,0,0) 46%,rgba(0,0,0,.42))}
.nothing #sShade{background:radial-gradient(circle,transparent 1.7px,rgba(0,0,0,.72) 2.3px) 0 0/6px 6px,linear-gradient(90deg,#000 40%,rgba(0,0,0,.5) 56%,transparent 72%),linear-gradient(0deg,rgba(0,0,0,.72),rgba(0,0,0,0) 46%,rgba(0,0,0,.42))}
#sBtns{display:flex;gap:14px;margin-top:20px}
.sB{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center}
.sB svg{width:30px;height:30px;fill:currentColor;display:block}
.sB:focus,.sB:hover{background:#fff;color:#0b0b0b}
.sMusic{background:#000}
.sMusic #sPhoto,.sMusic #sShade{display:block}
#sClock{position:absolute;left:96px;bottom:96px}
#sTime{font-size:250px;font-weight:200;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums}
#sDate{font-size:44px;font-weight:300;margin-top:14px}
.sMusic #sClock{left:auto;right:96px;bottom:auto;top:76px;text-align:right}
.sMusic #sTime{font-size:104px;font-weight:300}
.sMusic #sDate{font-size:30px;margin-top:6px}
#sTrack{position:absolute;left:96px;width:1120px;bottom:88px;display:grid;grid-template-columns:330px minmax(0,1fr);column-gap:50px;align-items:end}
#sCover{width:330px;height:330px;border-radius:30px;object-fit:cover;display:block;background:#222}
#sName{font-size:70px;font-weight:500;letter-spacing:-.02em;line-height:1.08;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
#sArtist{font-size:36px;font-weight:300;margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sLine{height:6px;border-radius:3px;background:rgba(255,255,255,.26);overflow:hidden;margin-top:34px}
#sProg{height:6px;background:#fff;transform-origin:left;transform:scaleX(0)}
#sTimes{display:flex;justify-content:space-between;font-size:26px;margin-top:12px;font-variant-numeric:tabular-nums}
.nothing #saver:not(.sMusic){color:var(--nInk)}
.nothing #sTime{font-family:"Doto",ui-monospace,monospace;font-weight:700}
.nothing #sDate,.nothing #sArtist,.nothing #sTimes{font-family:"DM Mono",monospace;font-weight:300;text-transform:uppercase}
.nothing #sName{font-family:"Doto",ui-monospace,monospace;font-weight:700;text-transform:uppercase}
.calm #sPhoto{animation:none}

/* Music module with nothing playing: one clear invitation to press play */
#mStart{display:none;width:100%;height:100%;border-radius:30px;text-align:left;grid-column:1/-1}
#mStart:focus,#mStart:hover{outline:4px solid #fff;outline-offset:8px}
#nMusic.empty{grid-template-columns:minmax(0,1fr)}
#nMusic.empty #mStart{display:block}
#nMusic.empty #nCover,#nMusic.empty #mInfo{display:none}
#eClassic,#eNothing{display:none;height:100%;align-items:center}
.nothing #eNothing{display:flex;gap:30px}
html:not(.nothing) #eClassic{display:flex;gap:32px}
#mid #nMusic.empty{background:linear-gradient(145deg,#1f8f4e,#14442b 44%,#121212 86%);padding:36px 40px}
#eLogo{width:250px;height:76px;object-fit:contain;display:block;filter:brightness(0) invert(1)}
#ePlay{width:124px;height:124px;border-radius:50%;background:#1ed760;display:grid;place-items:center;flex:none;color:#0b0b0b}
#ePlay svg{width:56px;height:56px;fill:currentColor;display:block;margin-left:5px}
#eText{min-width:0}
#eText span{display:block;font-size:27px;color:rgba(255,255,255,.76);margin-top:16px}
#eArt{width:318px;flex:none;color:var(--nL)}
#eArt svg{display:block;width:100%;height:auto}
#eLab b{display:block;font-family:"Doto",ui-monospace,monospace;font-weight:700;font-size:74px;line-height:1;color:var(--nL)}
#eLab span{display:block;font-size:19px;color:var(--nMut);margin-top:12px;font-family:"DM Mono",monospace;font-weight:300;text-transform:uppercase}
.tile{position:relative;flex:0 0 272px;height:190px;border-radius:32px;overflow:hidden;display:grid;place-items:center;background:var(--c);
  transition:transform .26s cubic-bezier(.2,.8,.2,1),box-shadow .26s}
.tile img{width:204px;height:112px;object-fit:contain;display:block;max-width:100%}
.flow{display:flex;align-items:center;gap:12px;color:#2bdca8;font-size:62px;font-weight:300;letter-spacing:-.01em;line-height:1}
.flow svg{width:62px;height:62px;display:block}
.tile img.white{filter:brightness(0) invert(1)}
.tile img.sq{width:150px;height:150px}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(150deg,rgba(255,255,255,.26),rgba(255,255,255,0) 40%);opacity:.7}
.tile:focus,.tile:hover{transform:scale(1.07) translateY(-6px);box-shadow:inset 0 2px 0 rgba(255,255,255,.55),0 0 0 4px rgba(255,255,255,.9),0 40px 80px var(--shadow)}

#toast{position:absolute;left:50%;top:60px;transform:translate(-50%,-320%);opacity:0;padding:18px 38px;border-radius:40px;font-size:28px;font-weight:500;transition:transform .35s cubic-bezier(.2,.8,.2,1);z-index:5}
#toast.on{transform:translate(-50%,0);opacity:1}

.modal{position:absolute;inset:0;background:rgba(6,8,16,.42);display:grid;place-items:center;z-index:4}
#sheet.low{align-items:end;padding-bottom:44px;background:rgba(6,8,16,.08)}
#sheet.low #panel{background:rgba(16,18,30,.72);padding-block:32px}
#sheet.low h2{display:none}
#sheet.low #tabs{margin-top:0}
#panel,.panel{width:1440px;border-radius:52px;padding:44px 56px;background:var(--glass-strong)}
#panel h2,.panel h2{margin:0;font-size:48px;font-weight:500;letter-spacing:-.02em}
#tabs{display:flex;gap:12px;margin:20px 0 24px}
#tabs .pill{background:rgba(255,255,255,.12)}
#tabs .pill.sel{background:rgba(255,255,255,.34)}
#hint{font-size:26px;color:var(--ink-soft);margin:0 0 20px;font-weight:300}
#grid,#allGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
#allGrid{margin-top:24px}
.opt{height:100px;border-radius:28px;padding:0 20px 0 14px;display:flex;align-items:center;gap:18px;font-size:30px;font-weight:500;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);transition:transform .2s,background .2s}
.opt img{width:72px;height:72px;border-radius:18px;flex:none;display:block}
.opt span{min-width:0;flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opt em{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font-style:normal;font-size:24px;font-weight:600;background:#fff;color:#10131d;opacity:0}
.opt.sel{background:rgba(255,255,255,.26);border-color:rgba(255,255,255,.5)}
.opt.sel em{opacity:1}
.opt:focus,.opt:hover{transform:scale(1.03);box-shadow:0 0 0 4px rgba(255,255,255,.9)}
#themes,#clocks{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}
.theme{height:104px;border-radius:26px;background:var(--t);border:1px solid rgba(255,255,255,.3);display:flex;align-items:flex-end;padding:12px 16px;font-size:24px;font-weight:500;text-shadow:0 1px 8px rgba(0,0,0,.55);transition:transform .2s}
.theme.sel{box-shadow:inset 0 0 0 4px #fff}
.theme:focus,.theme:hover{transform:scale(1.05);box-shadow:0 0 0 4px rgba(255,255,255,.9)}
.clockopt{height:158px;border-radius:26px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);display:grid;grid-template-rows:1fr auto;place-items:center;padding:12px;transition:transform .2s}
.clockopt b{font-size:60px;font-weight:inherit;line-height:1;font-variant-numeric:tabular-nums}
.clockopt span{font-family:var(--font);font-size:24px;font-weight:500;color:var(--ink-soft)}
.clockopt .dial{width:96px;height:96px}
.clockopt.sel{box-shadow:inset 0 0 0 4px #fff}
.clockopt:focus,.clockopt:hover{transform:scale(1.05);box-shadow:0 0 0 4px rgba(255,255,255,.9)}
#cities{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.city{height:62px;border-radius:20px;font-size:24px;font-weight:500;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16)}
.city.sel{background:rgba(255,255,255,.34)}
.city:focus,.city:hover{outline:4px solid #fff}
#sysBtns{display:flex;gap:14px}
.foot{display:flex;justify-content:flex-end;gap:16px;margin-top:24px}
.foot .pill,#sysBtns .pill{background:rgba(255,255,255,.14)}
.foot .pill:focus,.foot .pill:hover,#sysBtns .pill:focus,#sysBtns .pill:hover{background:rgba(255,255,255,.9);color:#10131d}

/* TV: no blur, shadows or motion. The server adds .lite for every client except this PC. */
.lite body{padding:0}
.lite .pill,.lite .tile,.lite .theme,.lite .clockopt,.lite .amb,#toast{transition:none}
.lite #drift{animation:none}
.lite .glass,.lite #panel,.lite .clockopt{-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none}
/* glass without blur: a fixed sheen and a bright top edge, on their own layer so moving light never repaints them */
.lite .glass{background:linear-gradient(145deg,rgba(255,255,255,.24),rgba(255,255,255,.07) 60%);border:1px solid rgba(255,255,255,.3);border-top-color:rgba(255,255,255,.55)}
.lite #weather{will-change:transform}
.lite .tile{background:var(--c);border:0}
.lite #panel,.lite #sheet.low #panel,.lite .panel{background:#1b1e2c}
.lite .modal,.lite #sheet.low{background:rgba(6,8,16,.5)}
.lite #drift{transform:none}
.lite .amb{inset:0}
.lite #stage{border-radius:0}
.lite .tile::after{display:none}
.lite .tile:focus,.lite .tile:hover{transform:none;box-shadow:none;outline:6px solid #fff;outline-offset:4px}
.lite .pill:focus,.lite .pill:hover,.lite .theme:focus,.lite .theme:hover,.lite .clockopt:focus,.lite .clockopt:hover{transform:none}
.lite .theme:focus,.lite .theme:hover,.lite .clockopt:focus,.lite .clockopt:hover{box-shadow:none;outline:4px solid #fff}

/* Music */
#wipe{position:absolute;inset:0;z-index:30;background:#000;opacity:0;pointer-events:none;transition:opacity .26s ease-in}
#wipe.on{opacity:1}
/* Arrow to the Game Zone */
#gzArrow{position:absolute;left:50%;bottom:6px;margin-left:-41px;width:82px;height:60px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink-soft,#fff);background:none}
.nothing #gzArrow{color:var(--nInk)}
#gzArrow{opacity:.38;transition:opacity .15s linear}
#gzArrow:focus,#gzArrow:hover{opacity:1}
#gzPad{width:36px;height:23px;flex:none}
#gzChev{width:26px;height:13px;flex:none;animation:gzBob 2.4s ease-in-out infinite}
#gzArrow:focus,#gzArrow:hover{outline:3px solid currentColor}
@keyframes gzBob{50%{transform:translate3d(0,5px,0)}}
.calm #gzChev{animation:none}

/* Reduced Spotify: same look in every theme. Only the visible screen paints; the list jumps, it never animates. */
#spot{width:1720px;height:940px;display:grid;grid-template-columns:372px minmax(0,1fr);grid-template-rows:minmax(0,1fr);background:#121212;color:#fff;border-radius:30px;overflow:hidden;font-family:"Geist",system-ui,sans-serif;text-shadow:none}
#spNav{background:#000;padding:38px 26px;min-height:0;display:flex;flex-direction:column;gap:10px}
#spBrand{display:flex;align-items:center;gap:16px;padding:0 14px 26px}
#spLogo{width:150px;height:50px;object-fit:contain;object-position:left;flex:none}
#spBrand h2{margin:0;font:700 32px "Geist",system-ui,sans-serif;color:#fff}
.spTab{height:76px;border-radius:14px;display:flex;align-items:center;gap:18px;padding:0 18px;font:600 28px "Geist",system-ui,sans-serif;color:#b3b3b3;text-align:left;background:none}
.spTab svg{width:32px;height:32px;fill:currentColor;flex:none}
.spTab.sel{color:#fff;background:#2a2a2a}
#closeMus{margin-top:auto}
.spTab:focus,.spTab:hover{outline:4px solid #1ed760;outline-offset:-4px;color:#fff}
#spMain{min-width:0;display:grid;grid-template-rows:auto minmax(0,1fr);background:linear-gradient(180deg,#2c2640 0,#121212 340px)}
#spHead{display:flex;align-items:center;gap:30px;padding:38px 44px 26px}
#spArt{width:190px;height:190px;border-radius:12px;flex:none;background:#2a2a2a center/cover no-repeat;display:grid;place-items:center}
#spArt.heart{background:linear-gradient(135deg,#4b17e6,#c3f0d8)}
#spArt svg{width:92px;height:92px;fill:#fff}
#spInfo{min-width:0;flex:1}
#spKind{font-size:22px;font-weight:600;color:#d8d8d8}
#spName{margin:6px 0 8px;font:700 64px/1.08 "Geist",system-ui,sans-serif;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#spCount{margin:0;font-size:24px;color:#b3b3b3}
.spBtn{width:92px;height:92px;border-radius:50%;flex:none;display:grid;place-items:center;background:#1ed760;color:#000}
.spBtn svg{width:46px;height:46px;fill:currentColor}
#spShuf{width:72px;height:72px;background:#2a2a2a;color:#fff}
#spShuf svg{width:36px;height:36px}
.spBtn:focus,.spBtn:hover{outline:5px solid #fff;outline-offset:4px}
#spBody{overflow:hidden;padding:6px 44px 0;position:relative}
.spMsg{font-size:28px;color:#b3b3b3;padding:30px 0;line-height:1.35}

#spGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.spC{min-width:0;border-radius:14px;padding:14px;text-align:left;color:#fff;background:#1c1c1c}

.spC:focus,.spC:hover{background:#2a2a2a;outline:4px solid #1ed760;outline-offset:-4px}
#nMusic{display:grid;grid-template-columns:232px minmax(0,1fr);column-gap:30px;align-items:center;padding:36px;min-width:0}

/* Classic: glass card beside a compact weather card, with a fine line for progress */
#mid #nMusic{border-radius:44px;height:304px}

#mTitle{font-size:36px;font-weight:500;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mArtist{color:var(--nMut);margin-top:6px;font-size:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mBar{display:flex;gap:5px;margin-top:18px}
#mBar i{display:block;width:9px;height:9px;border-radius:50%;background:#3a3c3b}
#mBar i.on{background:var(--nL)}
#mBar i.now{background:var(--nA)}
#mBtns{display:flex;gap:12px;margin-top:18px}
.mB{width:64px;height:64px;border-radius:50%;background:#232423;color:var(--nL);display:grid;place-items:center}
.mB svg{width:26px;height:26px;fill:currentColor;display:block}
.mB:focus,.mB:hover{background:var(--nL);color:var(--nD);outline:4px solid var(--nA);outline-offset:3px}

/* Nothing skin: flat monochrome modules, dot type and one red accent. Flat fills keep it the fastest theme. */
:root{--nBg:#cbcfcd;--nD:#0d0d0d;--nL:#f1f2f0;--nW:#f1f2f0;--nA:#d71921;--nMut:#a8acaa;--nInk:#0d0d0d;--nDotS:rgba(13,13,13,.25);--nDotB:rgba(13,13,13,.33);--nGlow:rgba(255,255,255,.42);--nShade:rgba(60,66,64,.2);--nDim:#3a3c3b}
#modes{display:grid;grid-template-columns:1fr 1fr;gap:16px}
#modes .theme{height:150px;font-size:32px;padding:20px 26px}
#nGrid{display:none}
.nothing #drift,.nothing #veil,.nothing .blob,.nothing #mid,.nothing #hello,.nothing #line{display:none}
.nothing #stage{background:var(--nBg)}
/* Dot wave. Larger dots sit under a cover the color of the background; soft gaps in the cover slide across and reveal
   them, so dots seem to swell and darken in passing. Only the small cover moves; no dot is ever repainted. */
#wave,#tw{display:none;position:absolute;inset:0;overflow:hidden}
.nothing #wave{display:block}
/* red dots sit on the same 24px grid: they wake with the wave, and two fainter sets stay as quiet accents */
#waveDots{opacity:.7;position:absolute;inset:0;background:radial-gradient(circle,var(--nA) 3px,transparent 3.6px) 0 0/216px 168px,radial-gradient(circle,var(--nA) 3px,transparent 3.6px) 0 0/312px 264px,radial-gradient(circle,var(--nDotB) 3px,transparent 3.6px) 12px 12px/24px 24px}
#waveCover{position:absolute;left:0;top:-60px;width:985px;height:300px;transform-origin:0 0;will-change:transform;
  background:repeating-linear-gradient(100deg,var(--nBg) 0,var(--nBg) 250px,transparent 365px,var(--nBg) 480px);animation:nWave 28s linear infinite}
@keyframes nWave{from{transform:translate3d(-1950px,0,0) scale(4)}to{transform:translate3d(0,0,0) scale(4)}}
#waveTop{position:absolute;inset:0;background:radial-gradient(circle,rgba(215,25,33,.24) 1.9px,transparent 2.4px) 0 0/408px 360px,radial-gradient(circle,var(--nDotS) 1.7px,transparent 2.2px) 12px 12px/24px 24px,radial-gradient(90% 90% at 72% 8%,var(--nGlow),transparent 58%),radial-gradient(90% 90% at 20% 100%,var(--nShade),transparent 62%)}
.calm #waveCover{animation:none}
.calm #waveDots{display:none}
.tw{position:absolute;width:9px;height:9px;margin:-4.5px;border-radius:50%;background:var(--nD);opacity:0;animation:tw 5.5s ease-in-out infinite}
.tw.r{background:var(--nA)}
@keyframes tw{0%,100%{opacity:0;transform:scale(.5)}50%{opacity:.95;transform:scale(1.5)}}
.nothing #ui{grid-template-rows:auto auto;align-content:center;row-gap:20px;padding:0 96px}
.nothing #top{position:absolute;right:136px;top:127px;z-index:2}
.nothing #pills{gap:10px}
.nothing #pills .pill{background:var(--nW);color:var(--nD);border:0;box-shadow:none;font-family:"DM Mono",monospace;font-weight:300;text-transform:uppercase;font-size:20px;height:50px;padding:0 20px}
.nothing #pills .pill:focus,.nothing #pills .pill:hover{background:var(--nA);color:#fff;transform:none}
.nothing #nGrid{display:grid;grid-template-columns:312px 312px 312px 1fr;grid-template-rows:312px 312px;gap:20px}
.n{background:var(--nD);color:var(--nL);border-radius:44px;position:relative;overflow:hidden;min-width:0}
.n.w{background:var(--nW);color:var(--nD)}
.nLab{font-family:"DM Mono",monospace;font-weight:300;font-size:22px;text-transform:uppercase;letter-spacing:.02em}
#nDateT{display:grid;place-items:center;align-content:center}
#nDate{font-family:"Instrument Serif",Georgia,serif;font-size:182px;line-height:.9}
#nDow,#nMonth{color:var(--nMut)}
#nDateT{gap:6px}
#nClockT{border-radius:50%}
#nClockT svg{position:absolute;inset:0;width:100%;height:100%}
#nSec{position:absolute;left:50%;top:50%;width:0;height:0;will-change:transform;animation:nSpin 60s steps(60) infinite}
#nSec::after{content:"";position:absolute;left:-8px;top:-138px;width:16px;height:16px;border-radius:50%;background:var(--nA)}
@keyframes nSpin{to{transform:rotate(360deg)}}
#nTimeT{display:grid;place-items:center}
#nTime{font-family:"Doto",ui-monospace,monospace;font-weight:700;font-size:124px;letter-spacing:-.01em;line-height:1;text-align:center}
#nColon{position:absolute;right:32px;top:32px;width:14px;height:14px;border-radius:50%;background:var(--nA);animation:nBlink 2s steps(2,jump-none) infinite}
@keyframes nBlink{from{opacity:1}to{opacity:.15}}
#nHelloT{padding:40px 44px;display:flex;flex-direction:column;justify-content:flex-end}
#nHello{font-family:"Doto",ui-monospace,monospace;font-weight:700;font-size:54px;line-height:1.05;text-transform:uppercase;white-space:nowrap}
#nLine{color:var(--nMut);margin-top:14px;font-size:26px}
#nGrid #nMusic{grid-column:2/span 2;grid-row:2;background:var(--nD);color:var(--nL);border:0;box-shadow:none;border-radius:44px;-webkit-backdrop-filter:none;backdrop-filter:none;padding:40px}
.music #nClockT{display:none}
.music #nDateT{grid-area:1/1}.music #nIconT{grid-area:1/2}.music #nTimeT{grid-area:1/3}.music #nHelloT{grid-area:1/4}
.music #nWxT{grid-area:2/1;display:flex;flex-direction:column;justify-content:space-between;padding:32px 36px}
.music #nWeekB{grid-area:2/4}
.music #nTemp{font-size:92px}
.music #nCond{font-size:24px}
.music #nCity{font-size:17px}
.music #nWxT{gap:10px}
.music #nStats b{font-size:24px}
.music #nWxL{flex:1;justify-content:space-between}
.music #nStats{display:grid;grid-template-rows:1fr 1fr;height:82px;flex:none}
.music #nStats div{padding-top:0;align-items:center}
.music #nStats div:nth-child(-n+2){display:none}
#nDayRow{display:flex;justify-content:space-between;align-items:center;margin-top:34px}
#nDayBar{display:flex;gap:5px}
#nDayBar i{display:block;width:11px;height:11px;border-radius:50%;background:var(--nDim)}
#nDayBar i.on{background:var(--nL)}
#nDayBar i.now{background:var(--nA);animation:nBlink 2s steps(2,jump-none) infinite}
#nDayLab{color:var(--nMut);font-size:20px;white-space:nowrap}
#nWxT{grid-column:span 2;padding:36px 44px;display:grid;grid-template-columns:1fr 262px;column-gap:36px}
#nWxL{display:flex;flex-direction:column;justify-content:space-between;min-width:0}
#nStats{display:grid;grid-template-rows:repeat(4,1fr);align-items:center;font-size:20px;color:#555}
#nStats div{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid #c6c9c7;height:100%;padding-top:20px}
#nStats div:last-child{border-bottom:0}
#nStats b{font-family:var(--font);font-weight:500;font-size:28px;color:var(--nD);text-transform:none}
#nTemp{font-family:"Doto",ui-monospace,monospace;font-weight:700;font-size:136px;line-height:.95;white-space:nowrap}
#nCond{font-size:28px;font-weight:500}
#nCity{color:#555;margin-top:4px;font-size:20px}
/* Glyph matrix: a 26x26 canvas stretched to 12px cells under a fixed mask, so every dot keeps one size and only brightness changes */
/* every layer is round on its own: on the TV the parent's clip can slip while the canvas updates */
#nIconT{border-radius:50%;contain:paint}
#nGlyph{position:absolute;inset:0;width:312px;height:312px;image-rendering:pixelated;border-radius:50%}
#nGlyphDots{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,transparent 3.9px,var(--nD) 4.7px) 0 0/12px 12px}
.nDrops{animation:nDrop 1.6s steps(4) infinite}
@keyframes nDrop{from{transform:translateY(-4px);opacity:.3}to{transform:translateY(12px);opacity:1}}
.nPulse{animation:nBlink 2.4s steps(2,jump-none) infinite}
#nWeekB{padding:30px 44px 28px;display:flex;flex-direction:column;justify-content:space-between}
#nWeekH{display:flex;justify-content:space-between;color:var(--nMut)}
#nWeekT{display:grid;grid-template-columns:repeat(7,1fr);column-gap:8px;align-items:end}
.nDay{display:flex;flex-direction:column;align-items:center;gap:6px}
.nDay b{display:block;width:13px;height:13px;border-radius:50%;background:var(--nL)}
.nDay.now b{background:var(--nA)}
.nDay em{font-style:normal;font-size:24px;font-weight:500;margin-top:8px}
.nDay span{color:var(--nMut);font-size:20px;font-family:"DM Mono",monospace;font-weight:300;text-transform:uppercase}
.nDay.now span{color:var(--nL)}
.nothing #railCap{color:var(--nInk);font-family:"DM Mono",monospace;font-weight:300;text-transform:uppercase;font-size:24px;line-height:1;margin-bottom:20px}
.nothing .tile,.lite.nothing .tile{background:var(--nD);border:0;box-shadow:none;border-radius:40px}
.nothing .tile::after{display:none}
.imgN{display:none!important}
.nothing .tile img,.nothing .tile img.white{filter:brightness(0) invert(1)}
.nothing .flow{color:var(--nL)}
.nothing .tile:focus,.nothing .tile:hover,.lite.nothing .tile:focus,.lite.nothing .tile:hover{background:var(--nL);transform:none;box-shadow:none;outline:5px solid var(--nA);outline-offset:4px}
.nothing .tile:focus img,.nothing .tile:hover img{filter:brightness(0)}
.nothing .tile:focus .flow,.nothing .tile:hover .flow{color:var(--nD)}
/* YouTube: white button with a black triangle, inverted when selected so the triangle never disappears */
.nothing .hasN img{filter:none}
.nothing .hasN>img:not(.imgN){display:none}
.nothing .hasN>.imgN{display:block!important}
.nothing .hasN:focus>.imgN,.nothing .hasN:hover>.imgN{filter:invert(1)}
.nothing #panel,.lite.nothing #sheet.low #panel{background:var(--nD)}
.calm #nSec,.calm #nColon,.calm .nDrops,.calm .nPulse{animation:none}

/* Personalize: "you are here" is always a solid white ring or fill; "chosen" is always a check mark. They never look alike. */
#sheet .pill:focus,#sheet .pill:hover{background:#fff!important;color:#10131d!important;outline:4px solid #fff;outline-offset:5px;transform:none}
#tabs .pill.sel{background:rgba(255,255,255,.2);box-shadow:inset 0 -4px 0 #fff}
#sheet .theme,#sheet .clockopt,#sheet .city{position:relative}
#sheet .theme.sel,#sheet .clockopt.sel{box-shadow:none}
#sheet .theme:focus,#sheet .theme:hover,#sheet .clockopt:focus,#sheet .clockopt:hover,#sheet .city:focus,#sheet .city:hover{transform:none;box-shadow:none;outline:6px solid #fff;outline-offset:5px}
#sheet .sel:not(.pill)::after{content:"✓";position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;background:#fff;color:#10131d;display:grid;place-items:center;font-size:21px;font-weight:700;text-shadow:none}
#sheet .city.sel::after{top:50%;right:10px;margin-top:-14px;width:28px;height:28px;font-size:17px}
#sheet .theme{text-shadow:0 0 3px #000,0 1px 7px #000,0 0 12px #000}
.lite #sheet.low{background:rgba(6,8,16,.12)}
/* Theme cards: only the theme's background and its name in the theme's own type */
#sheet #modes .theme{height:200px;padding:0;align-items:center;justify-content:center;text-shadow:none;font-size:64px;line-height:1}
#sheet #m-classic{color:#fff;font-family:var(--font);font-weight:200;letter-spacing:-.02em}
#sheet #m-nothing{font-family:"Doto",ui-monospace,monospace;font-weight:700;text-transform:uppercase;font-size:60px}
#sheet #modes .sel::after{top:14px;right:14px}
/* Style swatches: a circle of the color, its name below */
#sheet #themes .theme{height:auto;background:none;border:0;padding:10px 4px 6px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:14px;font-size:24px;color:#fff;text-shadow:none}
#sheet #themes .theme::before{content:"";display:block;width:104px;height:104px;border-radius:50%;background:var(--t);box-shadow:inset 0 0 0 2px rgba(255,255,255,.34)}
#sheet #themes .theme:focus,#sheet #themes .theme:hover{outline:0}
#sheet #themes .theme:focus::before,#sheet #themes .theme:hover::before{outline:6px solid #fff;outline-offset:5px}
#sheet #themes .sel::after{top:45px;right:auto;left:50%;margin-left:-17px;background:#10131d;color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.6)}
#sheet .foot{align-items:center}
#navHint{margin-right:auto;font-size:23px;color:rgba(255,255,255,.66);font-family:var(--font);font-weight:400}

@media (prefers-reduced-motion:reduce){#drift,#nSec,#nColon,.nDrops,.nPulse,#waveCover{animation:none}.amb,.tile,.pill,.opt,#toast{transition:none}}
</style>

      if((x===7.5&&y===-8.5)||(x===9.5&&y===-1.5)||(x===2.5&&y===-10.5))return .5+.5*Math.sin(t*2.4+x);

function startGlyph(){
  if(glyphOn)return;
  glyphOn=true;
  const ctx=$('nGlyph').getContext('2d'),img=ctx.createImageData(GN,GN),px=img.data;
  const noise=new Float32Array(GN*GN).map(()=>Math.random());
  const t0=performance.now(),root=document.documentElement;
  let still=false;
  function draw(t,a,b,mix){
    for(let j=0,i=0;j<GN;j++)for(let k=0;k<GN;k++,i++){
      const x=k-GC,y=j-GC,d=Math.hypot(x,y),o=i*4;
      if(d>11.7){px[o+3]=0;continue}  // a clear margin, so no dot ever touches the edge of the circle
      const v=Math.min(1,noise[i]<mix?b(x,y,d,t):a(x,y,d,t));
      for(let c=0;c<3;c++)px[o+c]=glyphOff[c]+(glyphLit[c]-glyphOff[c])*v;
      px[o+3]=255;
    }
    ctx.putImageData(img,0,0);
  }
  /* 12 frames a second on 26x26 cells is enough to read as motion and stays cheap on the TV */
  setInterval(()=>{
    if(!root.classList.contains('nothing')||$('stage').classList.contains('idle'))return;
    if(root.classList.contains('calm')){if(!still)draw(0,SCENES[0],SCENES[0],0);still=true;return}
    still=false;

}

async function spToken(){
  if(!spTok)throw new Error('sin permiso');
  if(spTok.expires_at-Date.now()/1000>60)return spTok.access_token;
  const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:new URLSearchParams({grant_type:'refresh_token',refresh_token:spTok.refresh_token,client_id:spTok.client_id})});
  if(!r.ok)throw new Error('token '+r.status);
  const n=await r.json();
  spTok=Object.assign(spTok,n,{expires_at:Math.floor(Date.now()/1000)+n.expires_in});
  try{localStorage.setItem(SP_KEY,JSON.stringify(spTok))}catch(e){}
  return spTok.access_token;
}

function boombox(){
  let s='',r='';
  const dot=(x,y,c)=>'<circle cx="'+(x+.5)+'" cy="'+(y+.5)+'" r=".4" fill="'+c+'"/>';
  for(let y=0;y<18;y++)for(let x=0;x<44;x++){
    const dl=Math.hypot(x-10.5,y-10.5),dr=Math.hypot(x-33.5,y-10.5);
    let on=false;
    if(y<=2)on=x>=12&&x<=31&&(y===0||x===12||x===31);
    else if(y===3||y===17||x===0||x===43)on=true;
    else if(Math.min(dl,dr)>=4.5&&Math.min(dl,dr)<=5.9)on=true;
    else if(Math.min(dl,dr)<=1.6){r+=dot(x,y,'currentColor');continue}
    else if(x>=18&&x<=25&&y>=6&&y<=14&&(x===18||x===25||y===6||y===14))on=true;
    else if(x>=20&&x<=23&&Math.abs(y-10)<=(23-x))s+=dot(x,y,'var(--nA)');
    if(on)s+=dot(x,y,'currentColor');
  }
  return '<svg viewBox="0 0 44 18" aria-hidden="true">'+s+'<g class="nPulse">'+r+'</g></svg>';
}

  if(view.context){
    if(!DEMO)await spApi('/me/player/shuffle?state=true&device_id='+spDevice,'PUT');
    return spSend({context_uri:view.context},$('spName').textContent);
  }
  const a=view.tracks.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  if(a.length)spSend({uris:a.slice(0,100).map(x=>x.uri)},$('spName').textContent);
};
Object.keys(SP_TABS).forEach(t=>{
  const b=$('sp-'+t);
  b.onclick=()=>{clearTimeout(spTabT);spShow(t)};
  b.onfocus=()=>{if(b.classList.contains('sel'))return;clearTimeout(spTabT);spTabT=setTimeout(()=>spShow(t),260)};   // content follows the highlight
});
function spBack(){
  if(!parent)return closeMus();
  const t=Object.keys(SP_TABS).find(k=>$('sp-'+k).classList.contains('sel'));
  spShow(t).then(()=>focus($('spBody').querySelector('[data-f]')||$('sp-'+t)));
}
$('mStart').onclick=$('mList').onclick=()=>{
  if(!DEMO&&(!spTok||!spDevice))return toast(spTok?'Conectando con Spotify…':'Música disponible en la TV');
  musBack=document.activeElement;$('mus').hidden=false;
  const sp=byId('spotify');$('spLogo').src=sp.l||sp.i;
  spShow('liked');focus($('sp-liked'));
};

$('gzArrow').onclick=()=>{$('wipe').classList.add('on');setTimeout(()=>{location.href='juegos.html'},280)};

/* Server: only present while the page is served from the PC. */
async function loadServer(){
  if(ALONE){
    document.querySelectorAll('#pills [data-input],#settings,#vidaaHome,#takeover').forEach(b=>b.remove());
    return;
  }
  try{
    const r=await fetch('/api/prefs',{cache:'no-store'});
    if(!r.ok)return;
    const p=await r.json();live=true;
    if(p.usage&&typeof p.usage==='object'){usage=p.usage;renderRail();focus($('rail').firstChild)}
    if(typeof p.motion==='boolean'){motion=p.motion;applyMotion()}
    if(THEMES.some(t=>t.id===p.theme)){theme=p.theme;setAmbient(theme)}
    if(CLOCKS.some(c=>c.id===p.clock)){clockStyle=p.clock;setClock(clockStyle)}
    if(CITIES.some(c=>c.id===p.city)&&p.city!==city){city=p.city;wx=null;loadWeather()}
    const t=await (await fetch('/api/takeover',{cache:'no-store'})).json();
    $('takeover').textContent='Abrir Sala Glass al encender: '+(t.on?'Sí':'No');
  }catch(e){return}
  try{
    const s=(await (await fetch('/api/sources',{cache:'no-store'})).json()).sources||[];
    const hdmi=s.filter(x=>/hdmi/i.test(x.displayname||''));
    if(hdmi.length){
      document.querySelectorAll('#pills [data-input]').forEach(b=>b.remove());
      hdmi.forEach(x=>{
        const b=document.createElement('button'),n=x.displayname.replace('▶','').trim();
        b.className='pill glass';b.dataset.f='';b.dataset.go=n;b.dataset.input='';b.dataset.source=x.sourceid;b.textContent=n;
        $('settings').before(b);
      });
    }
  }catch(e){}
}

/* Remote */
function layerEl(){
  if($('stage').classList.contains('idle')&&mTrack)return $('saver');
  return !$('sheet').hidden?$('sheet'):!$('mus').hidden?$('mus'):null;
}
function items(){return [...(layerEl()||$('ui')).querySelectorAll('[data-f]')].filter(b=>b.offsetParent)}
function move(dx,dy){
  const list=items(),a=document.activeElement;
  if(!list.includes(a))return focus(list[0]);
  const r=a.getBoundingClientRect(),ax=r.left+r.width/2,ay=r.top+r.height/2;
  let best=null,bs=1e12;
  list.forEach(b=>{
    if(b===a)return;
    const q=b.getBoundingClientRect(),x=q.left+q.width/2-ax,y=q.top+q.height/2-ay;
    const along=dx?x*dx:y*dy,across=dx?Math.abs(y):Math.abs(x);
    if(along<=1)return;
    const s=along+across*2.2;
    if(s<bs){bs=s;best=b}
  });
  if(best)focus(best);
}
document.addEventListener('keydown',e=>{
  const k={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];
  if(k&&e.key==='ArrowDown'&&document.activeElement===$('gzArrow')){e.preventDefault();$('gzArrow').click();return}
  if(k){e.preventDefault();move(k[0],k[1]);return}
  const open=layerEl();
  if((e.key==='Escape'||e.keyCode===8)&&open){e.preventDefault();open.id==='sheet'?closeSheet():spBack()}
});

/* Rest mode: after a while with no input, only the clock stays; any key brings the rest back. */
const REST_MS=60000;
let restTimer;
function wake(e){
  const idle=$('stage').classList.contains('idle');
  if(idle&&e){
    /* with music the screensaver has its own controls: only Back leaves it */
    const backKey=e.key==='Escape'||e.keyCode===8||e.keyCode===461;
    if(mTrack&&e.type==='keydown'&&!backKey)return;
    if(e.type==='click'&&e.target.closest('#sBtns'))return;
    e.preventDefault();e.stopImmediatePropagation();
    $('stage').classList.remove('idle');
    focus(saverBack&&saverBack.offsetParent?saverBack:$('rail').firstChild);
  }
  clearTimeout(restTimer);
  restTimer=setTimeout(()=>{
    if(layerEl())return wake();
    enterSaver();
  },REST_MS);
}
/* Game controller: the browser reveals it after its first button press. It drives the same keys as the remote,
   and the check only runs while one is connected. */
const PAD_KEYS={12:'ArrowUp',13:'ArrowDown',14:'ArrowLeft',15:'ArrowRight',1:'Escape'};
let padTimer=0,padWas={},padRepeat={};
const padKey=k=>document.dispatchEvent(new KeyboardEvent('keydown',{key:k,bubbles:true,cancelable:true}));
function padOK(){
  const idle=$('stage').classList.contains('idle');
  padKey('Enter');
  if(!idle||mTrack){const a=document.activeElement;if(a&&a!==document.body)a.click()}
}
function padPress(i){
  if(i===0)return padOK();
  if(PAD_KEYS[i])return padKey(PAD_KEYS[i]);
  if(!player)return;
  if(i===2)player.togglePlay();else if(i===4)player.previousTrack();else if(i===5)player.nextTrack();
}
function padStatus(name){$('padState').textContent='Mando de juegos: '+(name?'conectado':'pulsa un botón para detectarlo')}
function padPoll(){
  const p=[...(navigator.getGamepads?navigator.getGamepads():[])].find(Boolean);
  if(!p){clearInterval(padTimer);padTimer=0;padStatus();return}
  const b=i=>!!(p.buttons[i]&&p.buttons[i].pressed),now=Date.now();
  const down={0:b(0),1:b(1),2:b(2),4:b(4),5:b(5),
    12:b(12)||p.axes[1]<-.6,13:b(13)||p.axes[1]>.6,14:b(14)||p.axes[0]<-.6,15:b(15)||p.axes[0]>.6};
  Object.keys(down).forEach(i=>{
    if(!down[i]){padWas[i]=false;return}
    if(!padWas[i]){padWas[i]=true;padRepeat[i]=now+380;padPress(+i)}
    else if(i>=12&&now>=padRepeat[i]){padRepeat[i]=now+140;padPress(+i)}   // holding a direction keeps moving
  });
}
addEventListener('gamepadconnected',()=>{
  padStatus(true);toast('Mando conectado');
  if(!padTimer)padTimer=setInterval(padPoll,50);
});
addEventListener('gamepaddisconnected',()=>toast('Mando desconectado'));

let saverBack=null;
function enterSaver(){
  saverBack=document.activeElement;
  renderSaver();$('stage').classList.add('idle');
  if(mTrack)focus($('sPlay'));
}
document.addEventListener('keydown',wake,true);
document.addEventListener('click',e=>{if($('stage').classList.contains('idle'))wake(e)},true);
$('saverBtn').onclick=enterSaver;

/* If the TV cannot keep the background moving smoothly, stop it by itself and stay fast. */
function checkSpeed(){
  if(!motion)return;
  let n=0;const t0=performance.now();
  (function tick(){
    n++;
    const dt=performance.now()-t0;
    if(dt<4000)return requestAnimationFrame(tick);
    if(n/(dt/1000)<24){motion=false;applyMotion();savePrefs();toast('Fondo fijo activado para ir más rápido')}
  })();
}
document.addEventListener('mouseover',e=>{const b=e.target.closest&&e.target.closest('[data-f]');if(b&&items().includes(b))focus(b)});

applyStyle(nStyle);applyMotion();setClock(clockStyle);renderRail();setAmbient(theme);clock();wake();
setInterval(clock,5000);
renderWeather(store.get('sala-wx-'+city)||SAMPLE);
loadWeather();setInterval(loadWeather,1200000);
loadServer();
if(/[?&]empty/.test(location.search))hasMusic=true;
musicUI(null);
startMusic();
focus($('rail').firstChild);
/* Preview only: ?live reloads when the file changes, ?demo shows a sample song. Neither runs on the TV address. */
if(/[?&]live/.test(location.search)){
  let seen=null;
  setInterval(async()=>{
    try{
      const m=(await fetch(location.pathname,{method:'HEAD',cache:'no-store'})).headers.get('last-modified');
      if(seen&&m!==seen)location.reload();
      seen=m;
    }catch(e){}
  },1500);
}
function demoSpotify(path){
  const art=(a,b)=>{const c=document.createElement('canvas');c.width=c.height=120;const x=c.getContext('2d'),g=x.createLinearGradient(0,0,120,120);g.addColorStop(0,a);g.addColorStop(1,b);x.fillStyle=g;x.fillRect(0,0,120,120);return [{url:c.toDataURL(),width:120}]};
  const pal=[['#e0704a','#31406e'],['#3fa7bd','#23407e'],['#d71921','#14141f'],['#f4c95d','#7a3e9d']];
  const track=i=>({uri:'spotify:track:'+i,name:i===0?'Canción de ejemplo':'Canción número '+(i+1),artists:[{name:'Artista de ejemplo'}],duration_ms:150000+i*7000,album:{images:art(...pal[i%4])}});
  const off=+(path.match(/offset=(\d+)/)||[0,0])[1];
  if(path.startsWith('/me/playlists')||path.startsWith('/me/albums')){
    const box=['Para la tarde','Viaje a Salta','Trabajo','Fiesta','Clásicos','Lo-fi','Domingo','Rock'].map((n,i)=>({id:'d'+i,uri:'spotify:list:'+i,name:n,images:art(...pal[i%4])}));
    return {status:200,data:{items:path.includes('albums')?box.map(a=>({album:a})):box}};
  }
  const n=path.startsWith('/me/tracks')?120:20;
  return {status:200,data:{total:n,next:off+50<n,items:Array.from({length:Math.min(50,n-off)},(_,i)=>({track:track(off+i)}))}};
}
if(DEMO){
  const c=document.createElement('canvas');c.width=c.height=460;
  const x=c.getContext('2d'),g=x.createLinearGradient(0,0,460,460);
  g.addColorStop(0,'#e0704a');g.addColorStop(1,'#31406e');x.fillStyle=g;x.fillRect(0,0,460,460);
  hasMusic=true;
  musicUI({name:'Canción de ejemplo',artist:'Artista de ejemplo',cover:c.toDataURL(),pos:92,dur:249,paused:false});
}
if(/[?&]saver/.test(location.search))enterSaver();
setTimeout(checkSpeed,3000);
</script>
