<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>Prueba Spotify</title>
<style>
body{margin:0;height:100vh;background:#0d0d0d;color:#f1f2f0;font:400 40px system-ui,sans-serif;display:flex;flex-direction:column;justify-content:center;padding:0 140px;box-sizing:border-box}
h1{font-size:76px;font-weight:500;margin:0 0 36px}
#r{font-size:44px;line-height:1.5;margin:0;padding:0;list-style:none}
.si{color:#3ddc97}.no{color:#ff5b5b}
#v{font-size:60px;font-weight:600;margin-top:40px}
#ua{font-size:22px;color:#8d9190;margin-top:28px}
</style>
</head>
<body>
<h1>Prueba de Spotify</h1>
<ul id="r"></ul>
<div id="v">Comprobando…</div>
<div id="ua"></div>
<script>
const list=document.getElementById('r');
function line(name,ok){const l=document.createElement('li');l.innerHTML=name+': <b class="'+(ok?'si':'no')+'">'+(ok?'SÍ':'NO')+'</b>';list.append(l)}
async function key(system,type){
  if(!navigator.requestMediaKeySystemAccess)return false;
  try{await navigator.requestMediaKeySystemAccess(system,[{initDataTypes:['cenc','keyids','webm'],audioCapabilities:[{contentType:type}],sessionTypes:['temporary']}]);return true}catch(e){return false}
}
function sdk(){return new Promise(ok=>{
  const s=document.createElement('script');s.src='https://sdk.scdn.co/spotify-player.js';
  window.onSpotifyWebPlaybackSDKReady=()=>ok(true);s.onerror=()=>ok(false);document.head.append(s);setTimeout(()=>ok(false),8000);
})}
(async()=>{
  const secure=window.isSecureContext;
  const mp4=await key('com.widevine.alpha','audio/mp4; codecs="mp4a.40.2"');
  const flac=await key('com.widevine.alpha','audio/mp4; codecs="flac"');
  const ready=await sdk();
  line('Página segura',secure);line('Protección de audio (AAC)',mp4);line('Protección de audio (FLAC)',flac);line('Reproductor de Spotify carga',ready);
  const go=secure&&(mp4||flac)&&ready;
  const v=document.getElementById('v');
  v.textContent=go?'RESULTADO: VALE LA PENA INTENTARLO':'RESULTADO: NO FUNCIONARÁ EN ESTA TV';
  v.className=go?'si':'no';
  document.getElementById('ua').textContent=navigator.userAgent;
})();
</script>
</body>
</html>
