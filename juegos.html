<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>Game Zone</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Press+Start+2P&family=Geist:wght@400;600;700&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:"Geist",system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
#app{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0}
[hidden]{display:none!important}

/* Console picker: each half of the screen is its console's own world. One side is always lit; everything here is painted once. */
#pick{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr}
#logo{position:absolute;left:0;right:0;top:34px;text-align:center;z-index:2;pointer-events:none;font:800 74px/1 "Doto",ui-monospace,monospace;letter-spacing:.08em;text-shadow:0 0 22px rgba(255,255,255,.55),0 4px 0 #000}
#upArrow{display:block;width:44px;height:22px;margin:-22px auto 8px;animation:upBob 2.4s ease-in-out infinite}
@keyframes upBob{50%{transform:translate3d(0,-5px,0)}}
#logo small{display:block;margin-top:8px;font:800 28px "Doto",ui-monospace,monospace;letter-spacing:.2em;color:#ffd34d;text-shadow:0 2px 0 #000;animation:gzBlink 1.3s steps(2) infinite}
@keyframes gzBlink{50%{opacity:.2}}
.con{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:96px;text-align:center}
.con::after{content:"";position:absolute;inset:0;background:#000;opacity:.3;transition:opacity .16s linear;z-index:3;pointer-events:none}
.con.on::after{opacity:0}
.con:focus{outline:none}
.con>svg,.con>h2,.con>p{position:relative;z-index:2}
.ghost{position:absolute;left:0;right:0;top:150px;text-align:center;font:900 330px/1 "Big Shoulders Display",sans-serif;letter-spacing:-.01em;z-index:0}
.floor{position:absolute;left:-30%;right:-30%;bottom:-40px;height:440px;z-index:1;transform:perspective(420px) rotateX(62deg);transform-origin:50% 100%}
.con>svg{width:740px;height:auto;margin-bottom:26px;transition:transform .16s ease-out}
.con.on>svg{transform:translate3d(0,-20px,0) scale(1.07)}
.con h2{margin:0;font:900 112px/1 "Big Shoulders Display",sans-serif;letter-spacing:.01em;text-transform:uppercase}
.con p{display:inline-block;margin:14px 0 0;padding:8px 24px;border-radius:24px;background:rgba(0,0,0,.5);font-size:27px;font-weight:600}
.con.on p{background:#fff;color:#0b0b14}
#c-segaMD{background:radial-gradient(60% 46% at 50% 56%,rgba(255,40,50,.5),transparent 72%),linear-gradient(180deg,#14060c,#050508 62%,#2a0710)}
#c-segaMD .ghost{color:rgba(255,50,60,.2)}
#c-segaMD .floor{background:repeating-linear-gradient(90deg,rgba(255,60,70,.42) 0 4px,transparent 4px 170px),repeating-linear-gradient(0deg,rgba(255,60,70,.42) 0 4px,transparent 4px 150px)}
#c-segaMD h2{color:#fff;text-shadow:5px 5px 0 #d8202a,10px 10px 0 #1c5fd0}
#c-gba{background:radial-gradient(60% 46% at 50% 56%,rgba(140,110,255,.7),transparent 72%),linear-gradient(180deg,#1b1270,#0b0838 62%,#2c1b9c)}
#c-gba .ghost{color:rgba(190,170,255,.2)}
#c-gba .floor{background:repeating-linear-gradient(90deg,rgba(255,224,107,.4) 0 4px,transparent 4px 170px),repeating-linear-gradient(0deg,rgba(255,224,107,.4) 0 4px,transparent 4px 150px)}
#c-gba h2{color:#ffe06b;text-shadow:5px 5px 0 #4a3bd0,10px 10px 0 #120c55}
#scan{position:absolute;inset:0;z-index:4;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 2px,transparent 2px 5px)}
#foot{position:absolute;left:0;right:0;bottom:26px;text-align:center;font-size:24px;color:#e4e4ee;z-index:5;pointer-events:none}

/* Game row: same world as the picker. Covers stand on the neon floor; only the row slides, on one layer. */
#shelf{position:absolute;inset:0;overflow:hidden}
#shelf.segaMD{background:radial-gradient(52% 44% at 50% 50%,rgba(255,40,50,.5),transparent 74%),linear-gradient(180deg,#14060c,#050508 62%,#2a0710)}
#shelf.gba{background:radial-gradient(52% 44% at 50% 50%,rgba(140,110,255,.7),transparent 74%),linear-gradient(180deg,#1b1270,#0b0838 62%,#2c1b9c)}
#shelf .ghost{top:96px;font-size:520px;color:rgba(255,255,255,.07)}
#shelf.segaMD .ghost{color:rgba(255,50,60,.17)}
#shelf.gba .ghost{color:rgba(190,170,255,.17)}
#shelf .floor{bottom:-40px;height:1000px;transform:perspective(560px) rotateX(68deg)}
#shelf.segaMD .floor{background:repeating-linear-gradient(90deg,rgba(255,60,70,.42) 0 4px,transparent 4px 170px),repeating-linear-gradient(0deg,rgba(255,60,70,.42) 0 4px,transparent 4px 150px)}
#shelf.gba .floor{background:repeating-linear-gradient(90deg,rgba(255,224,107,.4) 0 4px,transparent 4px 170px),repeating-linear-gradient(0deg,rgba(255,224,107,.4) 0 4px,transparent 4px 150px)}
#top{position:absolute;left:80px;right:80px;top:36px;display:flex;align-items:center;gap:22px;z-index:5}
#top svg{width:150px;height:auto;flex:none}
#top h1{flex:1;margin:0;font:900 64px/1 "Big Shoulders Display",sans-serif;text-transform:uppercase}
#top h1 small{display:block;margin-top:4px;font:600 24px "Geist",sans-serif;text-transform:none;opacity:.85}
.pill{height:68px;padding:0 30px;border-radius:34px;background:rgba(0,0,0,.5);font-size:25px;font-weight:600;flex:none}
#add{background:#ffd34d;color:#0b0b14}
#edit.on{background:#e0483e}
.pill:focus,.pill:hover{outline:5px solid #fff;outline-offset:3px}
#grid{position:absolute;left:0;top:216px;height:540px;width:max-content;min-width:1920px;display:flex;align-items:flex-end;gap:54px;z-index:2;transition:transform .18s ease-out;will-change:transform}
.game{position:relative;flex:none;display:block;transform-origin:50% 100%;transition:transform .14s ease-out;opacity:.62}
.box{position:relative;display:block;height:400px;aspect-ratio:3/4;border-radius:6px;overflow:hidden;background:#222;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.box img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.art{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;font:900 44px/1.02 "Big Shoulders Display",sans-serif;text-transform:uppercase;overflow-wrap:anywhere}
.segaMD .art{background:linear-gradient(180deg,#d8202a 0 7%,#111 7% 9%,#1c5fd0 9% 16%,transparent 16%),#101016}
.gba .art{background:radial-gradient(circle,rgba(255,255,255,.2) 2px,transparent 2.5px) 0 0/16px 16px,linear-gradient(160deg,#6d57ff,#2a1fa0);color:#ffe06b}
.game:hover,.game:focus{outline:none;opacity:1;transform:scale(1.28);z-index:2}
.game:focus .box,.game:hover .box{box-shadow:0 0 0 5px #fff}
.segaMD .game:focus .box{box-shadow:0 0 0 5px #fff,0 0 0 11px #d8202a}
.gba .game:focus .box{box-shadow:0 0 0 5px #fff,0 0 0 11px #ffe06b}
.removing .game:focus .box{box-shadow:0 0 0 5px #fff,0 0 0 11px #e0483e}
#now{position:absolute;left:0;right:0;bottom:64px;text-align:center;z-index:5;padding:0 80px}
#nowT{margin:0;font:900 96px/1 "Big Shoulders Display",sans-serif;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 12px 12px}
.segaMD #nowT{color:#fff;text-shadow:4px 4px 0 #d8202a,8px 8px 0 #1c5fd0}
.gba #nowT{color:#ffe06b;text-shadow:4px 4px 0 #4a3bd0,8px 8px 0 #120c55}
#nowS{font:800 30px "Doto",ui-monospace,monospace;letter-spacing:.16em;color:#ffd34d;text-shadow:0 2px 0 #000;animation:gzBlink 1.3s steps(2) infinite}
.removing #nowS{color:#ff8a82}
#empty{width:1920px;align-self:center;text-align:center;font-size:36px;line-height:1.35;padding:0 300px}
#empty b{color:#ffd34d}
#shelfScan{position:absolute;inset:0;z-index:4;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 2px,transparent 2px 5px)}

#file{position:absolute;left:-9999px}
#game{position:fixed;inset:0;background:#000;display:none}
.playing #game{display:block}
.playing #app{display:none}
#toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);padding:16px 30px;border-radius:30px;background:#fff;color:#0b0b14;font-size:26px;font-weight:600;display:none;z-index:9}
#toast.on{display:block}

/* Arcade skin: pixel type, score bar and a CRT tube over everything. Painted once. */
#hud{position:absolute;left:0;right:0;top:0;height:50px;z-index:6;display:flex;justify-content:space-between;align-items:center;padding:0 70px;font:18px "Press Start 2P",monospace;color:#ff5a4f;background:#000;pointer-events:none}
#hud b{font-weight:400;color:#fff}
#app::after{content:"";position:absolute;inset:0;z-index:7;pointer-events:none;border-radius:44px;box-shadow:0 0 0 30px #000,inset 0 0 170px rgba(0,0,0,.72)}
#logo{top:74px;font:44px/1 "Press Start 2P",monospace;letter-spacing:0;color:#ffd34d;text-shadow:4px 4px 0 #d8202a,8px 8px 0 #000}
#logo small{margin-top:16px;font:18px "Press Start 2P",monospace;letter-spacing:0;color:#fff;text-shadow:3px 3px 0 #000}
#upArrow{margin:-12px auto 10px;color:#fff}
.con{padding-bottom:88px}
.con>img.real{width:640px;height:auto;margin-bottom:26px;position:relative;z-index:2;transition:transform .16s ease-out}
.con.on>img.real{transform:translate3d(0,-64px,0) scale(1.1)}
#top img.real{width:124px;height:auto;display:block}
.ghost{top:176px}
.con h2{font:46px/1.1 "Press Start 2P",monospace;letter-spacing:0}
#c-segaMD h2{text-shadow:4px 4px 0 #d8202a,8px 8px 0 #1c5fd0}
#c-gba h2{text-shadow:4px 4px 0 #4a3bd0,8px 8px 0 #120c55}
.con p{margin-top:22px;padding:10px 18px;border-radius:0;font:17px "Press Start 2P",monospace;box-shadow:0 0 0 4px #000}
#foot{bottom:30px;font:16px "Press Start 2P",monospace}
#top{top:66px}
#top svg{width:124px}
#top h1{font:32px/1.2 "Press Start 2P",monospace}
#top h1 small{margin-top:8px;font:15px "Press Start 2P",monospace}
.pill{height:62px;padding:0 22px;border-radius:0;font:15px "Press Start 2P",monospace;box-shadow:0 0 0 4px #000,0 0 0 8px rgba(255,255,255,.75)}
.pill:focus,.pill:hover{outline:none;box-shadow:0 0 0 4px #000,0 0 0 9px #ffd34d}
#grid{top:176px;height:540px}
.box,.art{border-radius:0}
.art{font:20px/1.3 "Press Start 2P",monospace}
.game:focus,.game:hover{transform:scale(1.22)}
#floorWrap{position:absolute;left:0;right:0;top:716px;bottom:0;overflow:hidden;perspective:260px;perspective-origin:50% 0;border-top:4px solid #fff;z-index:1}
#shelf.segaMD #floorWrap{border-color:#ff5a62}
#shelf.gba #floorWrap{border-color:#ffe06b}
#shelf #floorWrap .floor{left:-150%;right:-150%;top:auto;bottom:0;height:2600px;transform-origin:50% 100%;transform:rotateX(82deg)}
#now{bottom:58px}
#nowT{font:44px/1.3 "Press Start 2P",monospace;padding:0 0 18px}
#nowS{font:20px "Press Start 2P",monospace;letter-spacing:0}
#empty{font:22px/1.8 "Press Start 2P",monospace;padding:0 240px}
#floorWrap::after{content:"";position:absolute;left:0;right:0;top:0;height:62%;z-index:1}
#shelf.segaMD #floorWrap::after{background:linear-gradient(180deg,#0a0508 0,rgba(10,5,8,.9) 45%,transparent)}
#shelf.gba #floorWrap::after{background:linear-gradient(180deg,#1a1272 0,rgba(26,18,114,.9) 45%,transparent)}
.con .floor{opacity:.75}
/* TV: no scanlines, tube shadow, 3D floor or animated layers. A plain line replaces the floor. */
.lite #scan,.lite #shelfScan,.lite .floor,.lite #app::after{display:none}
.lite #floorWrap::after{display:none}
.lite #grid,.lite .game,.lite .con::after{transition:none}
.lite #grid{will-change:auto}
.lite #logo small,.lite #nowS,.lite #upArrow{animation:none}
.lite .ghost{display:none}
.lite .game:focus,.lite .game:hover{transform:none}
.lite .game:focus .box{outline:6px solid #fff}
#fade{position:fixed;inset:0;background:#000;z-index:20;pointer-events:none;opacity:0;animation:fadeIn .34s ease-out}
#fade.out{animation:none;transition:opacity .26s ease-in}
@keyframes fadeIn{from{opacity:1}to{opacity:0}}
#fps{position:fixed;right:18px;top:12px;z-index:9;font:18px "Press Start 2P",monospace;color:#7dffd2;text-shadow:2px 2px 0 #000;pointer-events:none}
/* TV: the emulator draws at a third of the size and the screen stretches it, far cheaper than painting every pixel. */
.lite.playing #game{inset:auto;left:0;top:0;width:33.334vw;height:33.334vh;transform:scale(3);transform-origin:0 0}
.con{padding-bottom:128px}
.con>img.real{margin-bottom:34px;transition:transform .2s ease-out}
/* Retro TV: painted once and kept behind the game, so it adds no work while playing. */
#tv{position:fixed;left:0;top:0;outline:2000px solid #0b0705;width:1920px;height:1080px;display:none;transform-origin:0 0;background:radial-gradient(70% 70% at 50% 45%,#2a1d16,#0b0705)}
.playing #tv{display:block}
#cab{position:absolute;left:96px;top:30px;width:1728px;height:1020px;border-radius:56px;background:repeating-linear-gradient(92deg,rgba(0,0,0,.14) 0 3px,transparent 3px 11px,rgba(255,200,130,.05) 11px 14px,transparent 14px 26px),linear-gradient(180deg,#8a5428,#5f3517 58%,#3f2210);box-shadow:inset 0 3px 0 rgba(255,220,170,.45),inset 0 -8px 0 rgba(0,0,0,.45)}
#bezel{position:absolute;left:150px;top:70px;width:1292px;height:940px;border-radius:44px;background:#111014;box-shadow:inset 0 0 0 8px #2c2a30,inset 0 0 0 11px #000}
#panel{position:absolute;left:1476px;top:70px;width:312px;height:940px;border-radius:24px;background:linear-gradient(180deg,#332f36,#1b191e);box-shadow:inset 0 0 0 3px #4b4650;display:flex;flex-direction:column;align-items:center;padding-top:44px;gap:34px}
.knob{width:138px;height:138px;border-radius:50%;background:radial-gradient(circle at 42% 34%,#efe6d4,#9a8e7a 62%,#4b4438);box-shadow:0 6px 0 #000;position:relative}
.knob::after{content:"";position:absolute;left:64px;top:8px;width:10px;height:50px;background:#1b191e}
.knob+.knob::after{transform:rotate(38deg);transform-origin:5px 61px}
#grill{width:216px;height:300px;background:repeating-linear-gradient(0deg,#050506 0 11px,#3b3740 11px 22px);border-radius:8px}
#panel span{font:17px "Press Start 2P",monospace;color:#ffd34d}
#panel u{width:30px;height:30px;border-radius:50%;background:#ff3b34;box-shadow:0 0 16px #ff3b34}
.playing #game{inset:auto;left:calc(180px*var(--s));top:calc(90px*var(--s));width:calc(1232px*var(--s));height:calc(900px*var(--s));background:#000;overflow:hidden}
.lite.playing #game{width:calc(410.667px*var(--s));height:calc(300px*var(--s));transform:scale(3);transform-origin:0 0}
</style>
</head>
<body>
<div id="app">
  <div id="hud"><span>1UP <b>000000</b></span><span>HI-SCORE <b>999990</b></span><span>CREDIT <b>01</b></span></div>
  <div id="logo"><svg id="upArrow" viewBox="0 0 24 12" aria-hidden="true"><path d="M3 10l9-8 9 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>GAME ZONE<small>INSERT COIN · ELIGE CONSOLA</small></div>
  <div id="pick">
    <button class="con" id="c-segaMD" data-f aria-label="Sega Genesis"><span class="ghost">16 BIT</span><span class="floor"></span>
      <img class="real" src="consola-genesis.png" alt="">
      <h2>Sega Genesis</h2><p id="n-segaMD"></p>
    </button>
    <button class="con" id="c-gba" data-f aria-label="Game Boy Advance"><span class="ghost">32 BIT</span><span class="floor"></span>
      <img class="real" src="consola-gba.png" alt="">
      <h2>Game Boy Advance</h2><p id="n-gba"></p>
    </button>
  </div>
  <div id="scan"></div>
  <div id="foot">ARRIBA: VOLVER A LA SALA</div>

  <div id="shelf" hidden>
    <span class="ghost" id="sGhost"></span><div id="floorWrap"><span class="floor"></span></div>
    <div id="top">
      <button class="pill" id="backCon" data-f>&lt; CONSOLAS</button>
      <div id="topIcon"></div>
      <h1><span id="sName"></span><small id="sCount"></small></h1>
      <button class="pill" id="add" data-f>Cargar desde USB</button>
      <button class="pill" id="edit" data-f>Quitar juegos</button>
    </div>
    <div id="grid"></div>
    <div id="now"><h3 id="nowT"></h3><div id="nowS"></div></div>
    <div id="shelfScan"></div>
  </div>
</div>
<input id="file" type="file" multiple accept=".md,.gen,.smd,.bin,.gba,.zip">
<div id="tv" aria-hidden="true">
  <div id="cab"></div><div id="bezel"></div>
  <div id="panel"><b class="knob"></b><b class="knob"></b><i id="grill"></i><span>GAME ZONE</span><u></u></div>
</div>
<div id="game"></div>
<div id="fps"></div>
<div id="toast"></div>
<div id="fade"></div>

<script>
/* Your own games: picked from a USB once, kept in this TV's browser storage, never uploaded anywhere.
   The emulator (EmulatorJS with Genesis Plus GX and mGBA) loads from its CDN only when a game starts, so this page stays light. */
const EJS_DATA='https://cdn.emulatorjs.org/4.2.3/data/';
const COVERS='https://raw.githubusercontent.com/libretro-thumbnails/';
const CONSOLES={
  segaMD:{n:'Sega Genesis',repo:'Sega_-_Mega_Drive_-_Genesis'},
  gba:{n:'Game Boy Advance',repo:'Nintendo_-_Game_Boy_Advance'}
};
const DEMO=/[?&]demo/.test(location.search);
const $=id=>document.getElementById(id);
const HOME='./'+(/github\.io$/.test(location.hostname)?'':'?tv=1&live=1&demo=1');
let playing=false,tt=0,con=null,removing=false,conFocus='c-segaMD';
if(/github\.io$/.test(location.hostname)||/[?&]lite/.test(location.search))document.documentElement.classList.add('lite');   // the TV gets the same design without its heavy layers
function fit(){const k=Math.min(innerWidth/1920,innerHeight/1080),t='scale('+k+')';$('app').style.transform=t;$('tv').style.transform=t;document.documentElement.style.setProperty('--s',k)}   // the frame and the game share one scale
addEventListener('resize',fit);fit();
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600)}
const sess={get:k=>{try{return sessionStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{sessionStorage.setItem(k,v)}catch(e){}}};

const db=new Promise((ok,no)=>{
  const r=indexedDB.open('sala-juegos',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('roms',{keyPath:'name'});
  r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);
});
const tx=async(mode,fn)=>{
  const s=(await db).transaction('roms',mode).objectStore('roms'),r=fn(s);
  return new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
};
const demoGames=[['Mi juego uno','segaMD'],['Mi juego dos','segaMD'],['Mi juego tres','segaMD'],['Aventura de prueba','gba'],['Carrera de prueba','gba']].map(g=>({name:g[0],core:g[1]}));
/* Private Drive: the permission arrives once in the address fragment, stays only on this TV and sees only
   the files uploaded by Sala Glass. No public links are involved. */
const DRIVE_KEY='sala-drive';
if(location.hash.length>4){
  try{localStorage.setItem(DRIVE_KEY,decodeURIComponent(escape(atob(location.hash.slice(1)))))}catch(e){}
  history.replaceState(null,'',location.pathname);
}
let dTok=null;try{dTok=JSON.parse(localStorage.getItem(DRIVE_KEY))}catch(e){}
async function dToken(){
  if(dTok.expires_at-Date.now()/1000>60)return dTok.access_token;
  const r=await fetch('https://oauth2.googleapis.com/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:new URLSearchParams({grant_type:'refresh_token',refresh_token:dTok.refresh_token,client_id:dTok.client_id,client_secret:dTok.client_secret})});
  if(!r.ok)throw new Error('token '+r.status);
  const n=await r.json();
  dTok=Object.assign(dTok,n,{expires_at:Math.floor(Date.now()/1000)+n.expires_in});
  try{localStorage.setItem(DRIVE_KEY,JSON.stringify(dTok))}catch(e){}
  return dTok.access_token;
}
const dFetch=async url=>fetch(url,{headers:{Authorization:'Bearer '+await dToken()}});
const DEMO_DRIVE=[{id:'d1',name:'Juego en Drive.md'},{id:'d2',name:'Otro juego en Drive.gba'}];
const coreByName=n=>/\.gba$/i.test(n)?'gba':/\.(md|gen|smd|bin)$/i.test(n)?'segaMD':null;
async function driveList(){
  if(DEMO&&!dTok)return DEMO_DRIVE;
  const r=await dFetch('https://www.googleapis.com/drive/v3/files?'+new URLSearchParams({q:"trashed=false and mimeType!='application/vnd.google-apps.folder'",fields:'files(id,name,size)',pageSize:200}));
  if(!r.ok)throw new Error('lista '+r.status);
  return (await r.json()).files;
}
async function driveGet(f){
  toast('Bajando '+f.name.replace(/\.[^.]+$/,'')+'…');
  const r=await dFetch('https://www.googleapis.com/drive/v3/files/'+f.id+'?alt=media');
  if(!r.ok)throw new Error('bajar '+r.status);
  await addFiles([new File([await r.blob()],f.name)]);
}
async function showDrive(){
  const w=$('grid');
  $('nowT').textContent='TU DRIVE';$('nowS').textContent='BUSCANDO JUEGOS…';w.textContent='';w.style.transform='';
  try{
    const saved=(await allGames()).map(g=>g.name),list=(await driveList()).filter(f=>coreByName(f.name)===con&&!saved.includes(f.name.replace(/\.[^.]+$/,'')));
    if(!list.length){
      w.innerHTML='<div id="empty">Ya tienes en la TV todos los juegos de esta consola que hay en tu Drive.</div>';
      $('nowT').textContent=$('nowS').textContent='';return $('add').focus({preventScroll:true});
    }
    list.forEach(f=>{
      const name=f.name.replace(/\.[^.]+$/,''),b=document.createElement('button'),box=document.createElement('span');
      b.className='game';b.dataset.f='';b.dataset.t=name.replace(/_ /g,' - ').replace(/\s*[\(\[].*$/,'');box.className='box';
      cover(box,{name,core:con});b.append(box);
      b.addEventListener('focus',()=>{showGame(b);$('nowS').textContent='OK PARA GUARDAR EN LA TV'});
      b.onclick=()=>driveGet(f).catch(()=>toast('No se pudo bajar. La TV pudo quedarse sin espacio.'));
      w.append(b);
    });
    sfx('ok');w.querySelector('.game').focus({preventScroll:true});
  }catch(e){toast('No se pudo leer Drive');$('nowT').textContent=$('nowS').textContent=''}
}
const allGames=async()=>DEMO?demoGames.concat(await tx('readonly',s=>s.getAll())):tx('readonly',s=>s.getAll());

/* A zip says what it holds in plain text near its start; a .bin is a Genesis dump. */
async function coreOf(file){
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  if(ext==='gba')return 'gba';
  if(['md','gen','smd','bin'].includes(ext))return 'segaMD';
  if(ext==='zip'){
    const head=new TextDecoder('latin1').decode(await file.slice(0,400).arrayBuffer()).toLowerCase();
    if(/\.(cue|iso|chd|pbp)/.test(head)||file.size>16e6)return null;   // disc games (PlayStation) are not supported here
    if(head.includes('.gba'))return 'gba';
    if(/\.(md|gen|smd|bin)/.test(head))return 'segaMD';
  }
  return null;
}
async function addFiles(files){
  let n=0,last=null;
  for(const f of files){
    const core=await coreOf(f);
    if(!core){toast('No reconozco '+f.name);continue}
    try{await tx('readwrite',s=>s.put({name:f.name.replace(/\.[^.]+$/,''),core,ext:f.name.split('.').pop().toLowerCase(),data:f}));n++;last=core}
    catch(e){toast('No hay espacio para '+f.name)}
  }
  if(n)toast(n===1?'Juego guardado':n+' juegos guardados');
  if(last)openShelf(last);
}

/* Covers come from the public libretro archive by exact title. Files named like "Game (USA)" match at once;
   for a bare name a few usual regions are tried, and the console-styled cover stays if none exists. */
function coverUrls(g){
  const safe=g.name.replace(/_ /g,' - ').replace(/\(USA Europe\)/,'(USA, Europe)').replace(/[&*\/:`<>?\\|"]/g,'_'),base=safe.replace(/\s*[\(\[].*$/,'');
  const names=[...new Set([safe].concat([' (USA)',' (USA, Europe)',' (USA, Australia)',' (World)',' (Europe)',''].map(r=>base+r)))];
  return names.map(n=>COVERS+CONSOLES[g.core].repo+'/master/Named_Boxarts/'+encodeURIComponent(n)+'.png');
}
function cover(box,g){
  const art=document.createElement('i');art.className='art';art.style.fontStyle='normal';art.textContent=g.name.replace(/\s*[\(\[].*$/,'');box.append(art);
  if(DEMO&&!g.data)return;
  const urls=coverUrls(g),im=new Image();let i=0;
  im.alt='';
  im.onload=()=>{box.style.aspectRatio=im.naturalWidth+'/'+im.naturalHeight;box.style.background='none';art.remove();box.append(im);if(document.activeElement===box.parentNode)showGame(box.parentNode)};   // the whole cover, at its own proportions
  im.onerror=()=>{if(++i<urls.length)im.src=urls[i]};
  im.src=urls[0];
}

function showPick(){
  con=null;$('shelf').hidden=true;$('pick').hidden=$('logo').hidden=$('foot').hidden=$('scan').hidden=false;
  allGames().then(all=>Object.keys(CONSOLES).forEach(k=>{
    const n=all.filter(g=>g.core===k).length;
    $('n-'+k).textContent=n?n+(n===1?' juego':' juegos'):'Sin juegos todavía';
  }));
  document.querySelectorAll('.con').forEach(c=>c.classList.toggle('on',c.id===conFocus));
  $(conFocus).focus({preventScroll:true});
}
async function openShelf(id){
  con=id;conFocus='c-'+id;removing=false;sess.set('gz-con',id);
  $('pick').hidden=$('logo').hidden=$('foot').hidden=$('scan').hidden=true;
  const sh=$('shelf');sh.hidden=false;sh.className=id;sh.classList.remove('removing');
  $('edit').classList.remove('on');$('edit').textContent='Quitar juegos';
  $('topIcon').replaceChildren($('c-'+id).querySelector('.real').cloneNode(true));
  $('sName').textContent=CONSOLES[id].n;
  $('sGhost').textContent=id==='gba'?'32 BIT':'16 BIT';
  const games=(await allGames()).filter(g=>g.core===id).sort((a,b)=>a.name.localeCompare(b.name)),w=$('grid');
  $('sCount').textContent=games.length+(games.length===1?' juego':' juegos');
  $('edit').hidden=!games.length;
  $('add').textContent=dTok||DEMO?'Cargar desde Drive':'Cargar desde USB';
  w.textContent='';w.style.transform='';$('nowT').textContent=$('nowS').textContent='';
  if(!games.length){
    w.innerHTML='<div id="empty">Elige <b>Cargar desde Drive</b> para traer tus juegos.<br>Solo se hace una vez por juego.</div>';
    return $('add').focus({preventScroll:true});
  }
  games.forEach(g=>{
    const b=document.createElement('button'),box=document.createElement('span'),title=g.name.replace(/_ /g,' - ').replace(/\s*[\(\[].*$/,'');
    b.className='game';b.dataset.f='';b.dataset.t=title;b.setAttribute('aria-label',title);box.className='box';
    cover(box,g);b.append(box);
    b.addEventListener('focus',()=>showGame(b));
    b.addEventListener('mouseenter',()=>b.focus({preventScroll:true}));
    b.onclick=async()=>{
      if(!removing)return play(g);
      await tx('readwrite',x=>x.delete(g.name));toast('Quitado de esta TV');openShelf(id);
    };
    w.append(b);
  });
  w.querySelector('.game').focus({preventScroll:true});
}
function showGame(b){
  $('nowT').textContent=b.dataset.t;
  $('nowS').textContent=removing?'OK PARA QUITAR':'PRESS OK TO START';
  $('grid').style.transform='translate3d('+(960-b.offsetLeft-b.offsetWidth/2)+'px,0,0)';
}
function goBack(){
  sfx('back');
  if(con)return showPick();
  $('fade').classList.add('out');requestAnimationFrame(()=>requestAnimationFrame(()=>{$('fade').style.opacity=1}));setTimeout(()=>location.replace(HOME),280);
}
function play(g){
  if(!g.data)return toast('Juego de ejemplo: carga uno tuyo para empezar');
  sfx('start');
  playing=true;document.body.classList.add('playing');
  Object.assign(window,{
    EJS_player:'#game',EJS_core:g.core==='segaMD'?'picodrive':g.core,EJS_gameName:g.name,EJS_gameUrl:URL.createObjectURL(new File([g.data],g.name+'.'+g.ext)),
    EJS_pathtodata:EJS_DATA,EJS_startOnLoaded:true,EJS_color:'#ffd34d',EJS_language:'es-ES',EJS_threads:false,
    /* Speed first: lighter builds, no video effects, and skip drawing frames rather than slow the game down. */
    EJS_defaultOptions:{webgl2Enabled:'disabled',shader:'disabled',rewindEnabled:'disabled',picodrive_renderer:'fast',picodrive_sound_rate:'22050',picodrive_frameskip:'auto',mgba_frameskip:'fixed_interval',mgba_frameskip_interval:'1',mgba_idle_optimization:'Detect and Remove'},
    EJS_Buttons:{playPause:false,restart:false,mute:false,settings:false,fullscreen:false,saveState:false,loadState:false,screenRecord:false,gamepad:false,cheat:false,volume:false,saveSavFiles:false,loadSavFiles:false,quickSave:false,quickLoad:false,screenshot:false,cacheManager:false,exitEmulation:false}
  });
  meter(g.name);
  const s=document.createElement('script');s.src=EJS_DATA+'loader.js';s.onerror=()=>{toast('No se pudo cargar el emulador');setTimeout(()=>location.reload(),2000)};document.head.append(s);
}

/* Measured speed of the running game, in the corner, while we tune it for the TV. */
function meter(name){
  let last=0;const samples=[];
  setInterval(()=>{
    const m=window.EJS_emulator&&EJS_emulator.gameManager;
    if(!m||!EJS_emulator.started)return;
    const n=m.getFrameNum();
    $('fps').textContent=(n-last)+' FPS';
    if(last)samples.push(n-last);
    last=n;
    if(samples.length===40)report(name,samples);
  },1000);
}

/* The TV saves its own speed numbers to the private Drive, so tuning relies on the real hardware, not on the PC. */
async function report(name,samples){
  if(!dTok)return;
  const meta={name:'medicion-tv.json',mimeType:'application/json'},data={game:name,core:EJS_emulator.getCore(),when:new Date().toISOString(),ua:navigator.userAgent,screen:[innerWidth,innerHeight,devicePixelRatio],samples};
  const b='salaglass',body='--'+b+'\r\nContent-Type: application/json\r\n\r\n'+JSON.stringify(meta)+'\r\n--'+b+'\r\nContent-Type: application/json\r\n\r\n'+JSON.stringify(data)+'\r\n--'+b+'--';
  try{await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{Authorization:'Bearer '+await dToken(),'Content-Type':'multipart/related; boundary='+b},body})}catch(e){}
}

/* 8-bit menu sounds, synthesized live: no audio files to download. Silent during a game. */
let actx=null;
const SFX={move:[[660,.04]],ok:[[523,.05],[784,.07]],back:[[523,.05],[330,.08]],start:[[523,.06],[659,.06],[784,.06],[1047,.12]]};
function sfx(id){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const go=()=>{
      let t=actx.currentTime+.01;
      SFX[id].forEach(n=>{
        const o=actx.createOscillator(),g=actx.createGain();
        o.type='square';o.frequency.value=n[0];
        g.gain.setValueAtTime(.22,t);g.gain.exponentialRampToValueAtTime(.001,t+n[1]);
        o.connect(g).connect(actx.destination);o.start(t);o.stop(t+n[1]);
        t+=n[1];
      });
    };
    actx.state==='running'?go():actx.resume().then(go).catch(()=>{});   // the TV starts audio asleep: wake it, then play
  }catch(e){}
}

/* Remote and game controller share these moves in the menus. */
function move(dx,dy){
  if(dy<0&&(!con||document.activeElement.classList.contains('pill')))return goBack();   // up leaves: shelf to consoles, consoles to the sala
  const list=[...document.querySelectorAll('[data-f]')].filter(b=>b.offsetParent),a=document.activeElement;
  if(!list.includes(a))return list[0]&&list[0].focus({preventScroll:true});
  const r=a.getBoundingClientRect(),ax=r.left+r.width/2,ay=r.top+r.height/2;
  let best=null,bs=1e12;
  list.forEach(b=>{
    if(b===a)return;
    const q=b.getBoundingClientRect(),x=q.left+q.width/2-ax,y=q.top+q.height/2-ay,along=dx?x*dx:y*dy,across=dx?Math.abs(y):Math.abs(x);
    if(along<=1)return;
    const s=along+across*2.2;
    if(s<bs){bs=s;best=b}
  });
  if(!best)return;
  sfx('move');
  best.focus({preventScroll:true});
}
document.addEventListener('keydown',e=>{
  const back=e.key==='Escape'||e.keyCode===8||e.keyCode===461;
  if(back){e.preventDefault();e.stopImmediatePropagation();playing?location.reload():goBack();return}
  if(playing)return;
  const k={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];
  if(k){e.preventDefault();move(k[0],k[1])}
},true);
const was={};
addEventListener('gamepadconnected',()=>setInterval(()=>{
  const p=[...navigator.getGamepads()].find(Boolean);if(!p)return;
  /* B + Start leaves a game: the emulator keeps every other button */
  if(playing){if(p.buttons[1]&&p.buttons[1].pressed&&p.buttons[9]&&p.buttons[9].pressed)location.reload();return}
  const b=i=>!!(p.buttons[i]&&p.buttons[i].pressed);
  const now={ok:b(0),back:b(1),u:b(12)||p.axes[1]<-.6,d:b(13)||p.axes[1]>.6,l:b(14)||p.axes[0]<-.6,r:b(15)||p.axes[0]>.6};
  Object.keys(now).forEach(k=>{
    if(now[k]&&!was[k]){
      if(k==='ok')document.activeElement.click();
      else if(k==='back')goBack();
      else move(k==='l'?-1:k==='r'?1:0,k==='u'?-1:k==='d'?1:0);
    }
    was[k]=now[k];
  });
},60));
Object.keys(CONSOLES).forEach(k=>{
  const b=$('c-'+k);
  b.onclick=()=>{sfx('ok');openShelf(k)};
  b.addEventListener('mouseenter',()=>b.focus({preventScroll:true}));
  b.addEventListener('focus',()=>{conFocus='c-'+k;document.querySelectorAll('.con').forEach(c=>c.classList.toggle('on',c===b))});
});
$('backCon').onclick=goBack;
/* Tells apart "the TV opened its file window" from "this browser has none": without this the button looks dead. */
$('add').onclick=()=>{
  if(dTok||DEMO)return showDrive();
  let opened=false;
  const seen=()=>{opened=true};
  addEventListener('blur',seen,{once:true});
  $('file').click();
  toast('Abriendo USB…');
  setTimeout(()=>{removeEventListener('blur',seen);if(!opened&&!document.hidden)toast('Esta TV no abrió el selector de archivos')},3500);
};
$('edit').onclick=()=>{
  removing=!removing;$('shelf').classList.toggle('removing',removing);$('edit').classList.toggle('on',removing);
  $('edit').textContent=removing?'Terminar':'Quitar juegos';
  toast(removing?'Elige el juego que quieres quitar':'Listo');
  $('nowS').textContent=removing?'OK PARA QUITAR':'PRESS OK TO START';
};
$('file').onchange=e=>{addFiles([...e.target.files]);e.target.value=''};
const last=sess.get('gz-con');
if(CONSOLES[last]&&performance.getEntriesByType('navigation')[0].type==='reload')openShelf(last);else showPick();
</script>
